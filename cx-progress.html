<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1b1b1b; --dim:#6b6b6b; --line:#e6e6e3; --accent:#2f5d50; --warn:#8a5a00; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) { --bg:#141414; --card:#1d1d1d; --ink:#ececec; --dim:#a0a0a0; --line:#2c2c2c; --accent:#8fc1b0; --warn:#e0b05a; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; } h2 { font-size:16px; margin:28px 0 8px; }
  .meta { color:var(--dim); margin:0 0 16px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .card b { display:block; font-size:20px; } .card span { color:var(--dim); font-size:13px; }
  .wrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:12px; }
  table { width:100%; border-collapse:collapse; font-size:14px; } th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; } tr:last-child td { border-bottom:0; }
  .st { padding:2px 8px; border-radius:999px; border:1px solid var(--line); font-size:12px; white-space:nowrap; }
  .st-done { color:var(--accent); border-color:var(--accent); } .st-isolated { color:var(--warn); border-color:var(--warn); }
  ul { margin:0; padding-left:18px; } .thumbs { display:flex; flex-wrap:wrap; gap:8px; } .thumbs img { width:180px; border:1px solid var(--line); border-radius:8px; }

<script>
(function(){
  var d = JSON.parse(document.getElementById('cx-data').textContent);
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
  var done = d.phases.filter(function(p){ return p.status === 'done'; }).length;

    '<h2>Phases</h2><div class="wrap"><table><thead><tr><th>Phase</th><th>Name</th><th>Status</th><th>Start</th><th>End</th><th>Specs</th><th>Notes</th></tr></thead><tbody>' +
